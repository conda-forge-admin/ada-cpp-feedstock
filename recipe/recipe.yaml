schema_version: 1

context:
  name: ada-cpp
  version: "0.38.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - url: https://github.com/Krande/adacpp/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 83b92f487791f11a18b5a6ba2bbfc25f6b601ebf335e7b485c99c4a980ddba3b
    patches:
      # src/render asks find_package(Python 3.12) although nothing in it needs 3.12, which fails
      # the python 3.11 builds; lower it to adacpp's requires-python floor.
      - render-python-3.10.patch

build:
  number: 0
  skip:
    - match(python, "<3.10")
    # osx-64 is near end of life and its CI is flaky; macOS ships for osx-arm64 only.
    - target_platform == "osx-64"

requirements:
  build:
    - ${{ stdlib("c") }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    # linux, NOT unix: `cdt()` resolves to a CentOS sysroot package
    # (mesa-libgl-devel-cos6-<arch>), and those are published for Linux
    # architectures only. `mesa-libgl-devel-cos6-x86_64` happens to exist, so
    # under `unix` the osx-64 build quietly installed a Linux sysroot package it
    # never used and passed anyway; osx-arm64 asks for
    # `mesa-libgl-devel-cos6-arm64`, which does not exist, and the solve fails.
    # macOS gets OpenGL from the system framework and needs no CDT either way.
    - if: linux
      then: ${{ cdt('mesa-libGL-devel') }}
    # Cross-compiling osx-arm64 from an osx-64 builder means the HOST python is
    # an arm64 binary the builder cannot execute. `cross-python_<target>` supplies
    # a runnable interpreter configured for the target, which is what lets CMake's
    # find_package(Python) answer correctly instead of falling back to whatever
    # python is on PATH -- on CI that was the runner's own pixi env (3.10).
    #
    # nanobind is here as well because cmake/build_python.cmake shells out to
    # `${Python_EXECUTABLE} -m nanobind --cmake_dir` before find_package(nanobind),
    # so it must be IMPORTABLE at build time, not merely present in host. It is a
    # noarch, header-only binding library, so the build env's copy is the same
    # code the target compiles against.
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - nanobind
    - cmake
    - ninja
  host:
    - python
    - occt
    # One build per ifcopenshell line in recipe/conda_build_config.yaml (0.8.5 and 0.9.0).
    - ifcopenshell
    # 0.8.x embeds rocksdb in libIfcParse.a and adacpp links RocksDB::rocksdb statically
    # beside it, so hold the rocksdb ABI 0.8.5 was built against; 0.9 co-solves with it.
    - rocksdb >=10.6.2,<10.7.0a0
    # ifcopenshell 0.9's IfcOpenShellConfig.cmake find_dependency()s these; neither is a run
    # dep of ifcopenshell. Unused by the 0.8.5 variant.
    - libxml2-devel
    - nlohmann_json
    - zlib
    - cgal-cpp
    - nanobind
    - cli11
    - tinygltf
    - gmsh
    # adacpp._render, the headless WebGPU renderer (src/render). wgpu-native's run_exports add it as a
    # run dependency; webgpu-headers carries webgpu.h.
    - wgpu-native >=29,<30
    - webgpu-headers
    - pip
    - setuptools
    - wheel
  run:
    - python
    - ${{ pin_compatible('gmsh', upper_bound='x.x') }}
  # Windows: wgpu_native.lib is the static library, so _render carries wgpu itself and needs no
  # wgpu-native at run time (see src/render/CMakeLists.txt).
  ignore_run_exports:
    by_name:
      - if: win
        then: wgpu-native
  run_exports:
    - ${{ pin_subpackage(name, upper_bound='x.x.x') }}

tests:
  - files:
      source:
        - tests
        - files
    requirements:
      run:
        - pytest
    script:
      - pytest tests
  - script:
      # The renderer module must import without a GPU (the adapter is only requested on construction).
      - python -c "from adacpp import _render; print(_render.OffscreenRenderer)"

about:
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: A module with drop-in replacement functions for ada-py written in c++ to improve performance.
  homepage: https://github.com/Krande/adacpp

extra:
  recipe-maintainers:
    - Krande
